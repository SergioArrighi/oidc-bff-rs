name: Release provenance

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - name: Require tag and workspace versions to match
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          cargo metadata --no-deps --format-version 1 \
            | jq -e --arg expected "${expected}" 'all(.packages[]; .version == $expected)'
      - name: Package exact source archives
        run: cargo package --workspace --locked --no-verify
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: target/package/oidc-bff-rs.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate release checksums
        working-directory: target/package
        run: sha256sum *.crate oidc-bff-rs.spdx.json > SHA256SUMS
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oidc-bff-rs-${{ github.ref_name }}
          path: |
            target/package/*.crate
            target/package/oidc-bff-rs.spdx.json
            target/package/SHA256SUMS
          if-no-files-found: error
      - name: Attest package, SBOM, and checksum provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            target/package/*.crate
            target/package/oidc-bff-rs.spdx.json
            target/package/SHA256SUMS
