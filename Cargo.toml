[workspace]
resolver = "2"
members = [
    "crates/oidc-bff-axum",
    "crates/oidc-bff-core",
    "crates/oidc-bff-leptos",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/SergioArrighi/oidc-bff-rs"

[workspace.dependencies]
aes-gcm = { version = "0.10", features = ["std", "zeroize"] }
async-trait = "0.1"
axum = { version = "0.8.6", features = ["json", "macros"] }
base64 = "0.23"
futures = "0.3"
getrandom = "0.3"
gloo-net = "0.6"
http-body-util = "0.1"
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
openidconnect = { version = "4.0.1", features = ["timing-resistant-secret-traits"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "rc"] }
serde_json = "1.0.145"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = { version = "0.3.44", features = ["serde"] }
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-sessions = { version = "0.14", features = ["signed"] }
url = "2.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Location", "ReadableStream", "ReadableStreamDefaultReader", "RequestCredentials", "RequestRedirect", "Window"] }
zeroize = { version = "1.8", features = ["alloc"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
